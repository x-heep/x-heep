adapter driver ftdi 	
adapter speed 1000
transport select jtag


# FT232HQ Adapter ZCU102
ftdi_vid_pid 0x0403 0x6014

ftdi_channel 0
ftdi_layout_init 0x00e8 0x60eb

reset_config none

echo "ftdi setting..."

set _CHIPNAME riscv

# TAP 1: PS TAP - irlen=6
jtag newtap zynq ps -irlen 6 -expected-id 0x5BA00477

# TAP 2: PL TAP - irlen=6,
jtag newtap $_CHIPNAME cpu -irlen 6 -expected-id 0x24738093

# TAP 3: Dummy TAP - irlen=6
jtag newtap zynq dummy -irlen 6 -ignore-version

set _TARGETNAME $_CHIPNAME.cpu
target create $_TARGETNAME riscv -chain-position $_TARGETNAME -coreid 0x000

echo "target created..." 

#log_output openocd_fpga.log

riscv set_ir dtmcs 0x922
riscv set_ir dmi 0x923

riscv set_reset_timeout_sec 2000
riscv set_command_timeout_sec 2000

echo "setting preferences..."

scan_chain

init

echo "init routine started"

halt

echo "Ready for Remote Connections"
